# =============================================================
# Docker Compose — CtrlXURL (Full Stack)
#
# Services:
#   1. mongo    — Database (Port 27017)
#   2. redis    — Caching layer (Port 6379)
#   3. backend  — Node.js Express API server (Port 3000)
#   4. frontend — React UI + Nginx (Port 5173)
#   5. nagios   — Monitoring dashboard (Port 8080)
# =============================================================

services:

  # ── 1. MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: ctrlxurl-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ctrlxurl-net

  # ── 2. Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ctrlxurl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ctrlxurl-net

  # ── 3. Backend API (Node.js / Express) ──────────────────────
  backend:
    build: ./server
    container_name: ctrlxurl-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/ctrlxurl
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
    networks:
      - ctrlxurl-net

  # ── 4. Frontend Web App (React + Nginx) ─────────────────────
  frontend:
    build: ./client
    container_name: ctrlxurl-frontend
    restart: unless-stopped
    ports:
      - "5173:80"                  # Open in browser: http://localhost:5173
    depends_on:
      - backend
    networks:
      - ctrlxurl-net

  # ── 5. Nagios Monitoring ────────────────────────────────────
  nagios:
    image: jasonrivers/nagios:latest
    platform: linux/amd64
    container_name: ctrlxurl-nagios
    restart: unless-stopped
    ports:
      - "8080:80"                  # Open in browser: http://localhost:8080/nagios
    environment:
      - NAGIOSADMIN_USER=nagiosadmin
      - NAGIOSADMIN_PASS=nagios123
    volumes:
      - ./nagios/ctrlxurl-nagios.cfg:/opt/nagios/etc/conf.d/ctrlxurl.cfg:ro
    depends_on:
      - backend
    networks:
      - ctrlxurl-net

networks:
  ctrlxurl-net:
    driver: bridge

volumes:
  mongo-data:
